services:
  db:
    image: postgres:16
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: fastapi_app
    restart: always
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/mydb
      SECRET_KEY: "dev-secret-key-change-in-production"
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads

  frontend:
    build: ./frontend
    container_name: nextjs_app
    restart: always
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  uploads_data:

#docker-compose.yalはdockerのコンテナの構築するコマンド
#解説
#- uploads_data:/app/uploads：コンテナの中の/app/uploadsというフォルダが、uploads_dataという名前の永続化領域に自動的に保存される、という設定です。これにより、docker compose restartやdocker compose down/upをしても、アップロードした画像が消えなくなります。
#ファイル末尾のvolumes:セクションにuploads_data:を追加するのは、「このボリュームを使いますよ」という宣言のようなものです（postgres_dataと同じ書き方です）。
